<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 지하철 🎲</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #f4f4f5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.6s ease;
  }
  body.has-line {
    background: linear-gradient(180deg, var(--line-color, var(--bg)) 0%, var(--bg) 65%);
  }
  .app {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 36px;
  }
  .stage {
    background: var(--surface);
    border-radius: 24px;
    padding: 40px 24px;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  /* 각 step 컨테이너도 flex column + gap으로 자식 간 간격 */
  .stage > div:not(.hidden) {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  .slot {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.03em;
    height: 60px;
    line-height: 60px;
    overflow: hidden;
    position: relative;
    width: 100%;
  }
  .slot-track {
    display: flex;
    flex-direction: column;
    transition: transform 0.05s linear;
  }
  .slot-item {
    height: 60px;
    line-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }
  .label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .line-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 16px;
    background: var(--line-color, #444);
    color: var(--line-text, #fff);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s ease;
  }
  .line-badge.show {
    opacity: 1;
    transform: translateY(0);
  }
  .station {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin: 0;
    text-align: center;
    word-break: keep-all;
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .station.show {
    opacity: 1;
    transform: scale(1);
  }
  .station-meta {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    opacity: 0;
    transition: opacity 0.4s ease 0.2s;
  }
  .station-meta.show { opacity: 1; }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 24px;
  }
  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    padding: 16px 24px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: var(--text);
    color: var(--bg);
  }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid #2c3038;
  }
  .footer {
    margin-top: 24px;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.6;
  }
  .hidden { display: none !important; }

  /* 시작 화면 — 호선 둘레 */
  .orbit-wrapper {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 12px;
  }
  .orbit {
    position: absolute;
    inset: 0;
    will-change: transform;
  }
  .orbit-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 52px;
    z-index: 2;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    pointer-events: none;
  }
  .orbit-pointer {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 11px solid var(--text);
    z-index: 3;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .orbit-dot.winner {
    box-shadow: 0 0 0 3px rgba(255,255,255,0.4), 0 0 20px rgba(255,255,255,0.6);
  }

  /* 토스트 (클립보드 복사 피드백) */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .orbit-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    margin: -15px 0 0 -15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    opacity: 0;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>오늘의 지하철 🎲</h1>
    <p class="subtitle">호선 뽑고, 역 뽑고. 어디 한번 가볼까.</p>

    <div class="stage">
      <!-- 1단계: 호선 뽑기 전 / 룰렛 회전 중 -->
      <div id="step-idle">
        <div class="orbit-wrapper">
          <div class="orbit-pointer"></div>
          <div class="orbit" id="orbit">
            <!-- 호선 점들은 JS로 생성 -->
          </div>
          <div class="orbit-center">🚇</div>
        </div>
      </div>

      <!-- 2단계: 호선 결과 -->
      <div id="step-line-result" class="hidden">
        <div class="label">오늘의 호선</div>
        <span class="line-badge" id="line-badge"></span>
      </div>

      <!-- 3단계: 역 슬롯 -->
      <div id="step-station-spin" class="hidden">
        <div class="label">이 호선의 역들 중에서...</div>
        <span class="line-badge show" id="line-badge-2"></span>
        <div class="slot">
          <div class="slot-track" id="station-track"></div>
        </div>
      </div>

      <!-- 4단계: 최종 결과 -->
      <div id="step-final" class="hidden">
        <span class="line-badge show" id="line-badge-3"></span>
        <h2 class="station" id="station-name"></h2>
        <div class="station-meta" id="station-meta"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="btn-action">호선 뽑기</button>
      <button class="btn-secondary hidden" id="btn-share">공유하기</button>
      <button class="btn-secondary hidden" id="btn-restart">처음부터 다시</button>
    </div>

    <div class="footer">수도권 전철 · 데이터는 큐레이션됨</div>
  </div>

  <div class="toast" id="toast">링크 복사됨</div>

// 호선 안내 멘트 (재미 요소)
const STATION_QUIPS = [
  "오늘은 여기로!","의외의 발견이 있을지도?",
  "가본 적 있어?", "맛집 검색 ㄱㄱ",
  "사진 찍기 좋은 곳일지도"
];

// ─── 유틸 ──────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const LINE_BY_ID = Object.fromEntries(LINES.map(l => [l.id, l]));

function setLineTheme(line) {
  document.body.style.setProperty('--line-color', line.color);
  document.body.style.setProperty('--line-text', line.textColor);
  document.body.classList.add('has-line');
}
function clearLineTheme() {
  document.body.classList.remove('has-line');
  document.body.style.removeProperty('--line-color');
  document.body.style.removeProperty('--line-text');
}
function renderBadge(el, line) {
  el.textContent = line.name;
  el.style.background = line.color;
  el.style.color = line.textColor;
}

// 슬롯머신 애니메이션
async function spinSlot(trackEl, items, finalItem, durationMs = 1800) {
  const itemHeight = 60;
  const reel = [];
  const minLoops = 12;
  for (let i = 0; i < minLoops; i++) {
    for (const it of items) reel.push(it);
  }
  reel.push(finalItem);

  // 1) 하드 리셋: transition 끄고 transform 0으로 즉시 스냅
  trackEl.style.transition = 'none';
  trackEl.style.transform = 'translateY(0px)';
  trackEl.innerHTML = reel.map(t => `<div class="slot-item">${t}</div>`).join('');

  // 2) 두 프레임 기다려서 리셋이 확실히 커밋되게 함
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // 3) 타겟 위치로 애니메이트
  const targetY = -(reel.length - 1) * itemHeight;
  trackEl.style.transition = `transform ${durationMs}ms cubic-bezier(0.15, 0.65, 0.25, 1)`;
  trackEl.style.transform = `translateY(${targetY}px)`;

  await sleep(durationMs + 50);
}

// ─── 룰렛 회전 ──────────────────────────────────────────────────
let orbitRotation = 0;

async function spinOrbit(targetIdx) {
  const orbit = $('orbit');
  const total = LINES.length;
  // 12시 방향에 targetIdx가 오게 하려면 -i/total*360 만큼 회전
  const targetMod = (((-(targetIdx / total) * 360) % 360) + 360) % 360;
  const minRotation = orbitRotation + 5 * 360; // 최소 5바퀴
  const minMod = ((minRotation % 360) + 360) % 360;
  let delta = targetMod - minMod;
  if (delta < 0) delta += 360;
  const newRotation = minRotation + delta;

  const duration = 2800;
  const easing = 'cubic-bezier(0.15, 0.7, 0.25, 1)';

  orbit.style.transition = `transform ${duration}ms ${easing}`;
  orbit.style.transform = `rotate(${newRotation}deg)`;

  // 각 점은 카운터 회전해서 글자가 똑바로 유지되게
  orbit.querySelectorAll('.orbit-dot').forEach(dot => {
    dot.style.transition = `transform ${duration}ms ${easing}`;
    dot.style.transform = `translate(${dot.dataset.x}px, ${dot.dataset.y}px) rotate(${-newRotation}deg)`;
  });

  orbitRotation = newRotation;
  await sleep(duration + 80);
}

function highlightWinner(targetIdx) {
  const dots = $('orbit').querySelectorAll('.orbit-dot');
  dots.forEach(d => d.classList.remove('winner'));
  if (dots[targetIdx]) dots[targetIdx].classList.add('winner');
}

// ─── 상태 머신 ──────────────────────────────────────────────────
let state = 'idle'; // idle | line-spinning | line-done | station-spinning | done
let chosenLine = null;
let chosenStation = null;

function showStep(id) {
  ['step-idle','step-line-result','step-station-spin','step-final']
    .forEach(s => $(s).classList.toggle('hidden', s !== id));
}

async function rollLine() {
  if (state !== 'idle') return;
  state = 'line-spinning';
  $('btn-action').disabled = true;

  const targetIdx = Math.floor(Math.random() * LINES.length);
  chosenLine = LINES[targetIdx];

  await spinOrbit(targetIdx);
  highlightWinner(targetIdx);

  await sleep(500);

  setLineTheme(chosenLine);
  showStep('step-line-result');
  const badge = $('line-badge');
  renderBadge(badge, chosenLine);
  badge.classList.add('show');

  await sleep(500);

  state = 'line-done';
  $('btn-action').textContent = '이 호선에서 역 뽑기';
  $('btn-action').disabled = false;
}

async function rollStation() {
  if (state !== 'line-done') return;
  state = 'station-spinning';
  $('btn-action').disabled = true;
  $('btn-share').classList.add('hidden'); // 회전 중엔 공유 버튼 숨김

  // 이전 단계 배지 보여주면서 슬롯 돌리기
  showStep('step-station-spin');
  renderBadge($('line-badge-2'), chosenLine);

  const stationNames = chosenLine.stations;
  chosenStation = pick(stationNames);

  await spinSlot($('station-track'), stationNames, chosenStation, 2200);

  await applyFinalState(chosenLine, chosenStation);
}

// 최종 결과 표시 — rollStation 끝과 딥링크 진입 모두에서 호출
async function applyFinalState(line, station) {
  chosenLine = line;
  chosenStation = station;
  setLineTheme(line);
  showStep('step-final');
  renderBadge($('line-badge-3'), line);
  $('station-name').textContent = station;
  $('station-meta').textContent = pick(STATION_QUIPS);
  await sleep(50);
  $('station-name').classList.add('show');
  $('station-meta').classList.add('show');

  state = 'done';
  $('btn-action').textContent = '한 번 더';
  $('btn-action').disabled = false;
  $('btn-restart').classList.remove('hidden');
  $('btn-restart').textContent = '다른 호선으로';
  $('btn-share').classList.remove('hidden');
  updateURL(line, station);
}

function reset() {
  state = 'idle';
  chosenLine = null;
  chosenStation = null;
  clearLineTheme();
  $('line-badge').classList.remove('show');
  $('station-name').classList.remove('show');
  $('station-meta').classList.remove('show');

  // 룰렛 회전 초기화 (transition 끄고 즉시 스냅)
  const orbit = $('orbit');
  orbit.style.transition = 'none';
  orbit.style.transform = 'rotate(0deg)';
  orbit.querySelectorAll('.orbit-dot').forEach(dot => {
    dot.classList.remove('winner');
    dot.style.transition = 'none';
    dot.style.transform = `translate(${dot.dataset.x}px, ${dot.dataset.y}px)`;
  });
  orbitRotation = 0;

  showStep('step-idle');
  $('btn-action').textContent = '호선 뽑기';
  $('btn-restart').classList.add('hidden');
  $('btn-share').classList.add('hidden');
  clearURL();
}

// ─── 이벤트 ──────────────────────────────────────────────────────
$('btn-action').addEventListener('click', async () => {
  if (state === 'idle') {
    await rollLine();
  } else if (state === 'line-done') {
    await rollStation();
  } else if (state === 'done') {
    // 한 번 더 — 같은 호선에서 다른 역
    state = 'line-done';
    $('station-name').classList.remove('show');
    $('station-meta').classList.remove('show');
    await rollStation();
  }
});

$('btn-restart').addEventListener('click', () => {
  reset();
});

$('btn-share').addEventListener('click', handleShare);

// ─── URL / 딥링크 / 공유 ─────────────────────────────────────────
function updateURL(line, station) {
  const params = new URLSearchParams();
  params.set('line', line.id);
  params.set('station', station);
  history.replaceState(null, '', '?' + params.toString());
}

function clearURL() {
  history.replaceState(null, '', location.pathname);
}

function tryDeepLink() {
  const params = new URLSearchParams(location.search);
  const lineId = params.get('line');
  const station = params.get('station');
  if (!lineId || !station) return false;
  const line = LINE_BY_ID[lineId];
  if (!line || !line.stations.includes(station)) {
    clearURL(); // 잘못된 파라미터는 정리
    return false;
  }
  applyFinalState(line, station);
  return true;
}

async function handleShare() {
  if (!chosenLine || !chosenStation) return;
  const url = location.href;
  const text = `오늘의 지하철 🎲 — ${chosenLine.name} ${chosenStation}`;

  if (navigator.share) {
    try {
      await navigator.share({ title: '오늘의 지하철', text, url });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // 사용자가 취소
      // 다른 에러면 클립보드 폴백으로 진행
    }
  }

  try {
    await navigator.clipboard.writeText(`${text}\n${url}`);
    showToast('링크 복사됨');
  } catch {
    showToast('복사 실패. 주소창을 직접 복사해주세요.');
  }
}

let toastTimer = null;
function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─── 시작 화면 호선 둘레 빌드 ───────────────────────────────────
function buildOrbit() {
  const orbit = $('orbit');
  const radius = 100;
  const total = LINES.length;
  LINES.forEach((line, i) => {
    // 12시 방향에서 시작해서 시계방향
    const angle = (i / total) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    const dot = document.createElement('div');
    dot.className = 'orbit-dot';
    dot.style.background = line.color;
    dot.style.color = line.textColor;
    dot.dataset.x = x;
    dot.dataset.y = y;
    // 초기 상태: 가운데에서 작게, 투명
    dot.style.transform = `translate(${x}px, ${y}px) scale(0.3)`;
    dot.style.transition = `transform 0.5s ease ${i * 30}ms, opacity 0.5s ease ${i * 30}ms`;
    dot.textContent = line.short;
    dot.title = line.name;
    orbit.appendChild(dot);
  });
  // 두 프레임 후 팝업
  requestAnimationFrame(() => requestAnimationFrame(() => {
    orbit.querySelectorAll('.orbit-dot').forEach(dot => {
      dot.style.transform = `translate(${dot.dataset.x}px, ${dot.dataset.y}px)`;
      dot.style.opacity = '1';
    });
  }));
}
buildOrbit();
tryDeepLink();
</script>
